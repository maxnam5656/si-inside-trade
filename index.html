<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมุดบันทึกระบบ Si Inside Trade (Updated)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f5f7fa; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1, h2, h3 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        .section { margin-bottom: 30px; padding: 20px; border: 1px solid #e2e8f0; border-radius: 8px; background: #fdfdfd; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #4a5568; }
        input[type="text"], input[type="number"], input[type="time"], select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input[readonly] { background-color: #edf2f7; color: #718096; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .flex-group { display: flex; gap: 10px; align-items: center; }
        .flex-group input { flex: 1; }
        .btn { background-color: #3182ce; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn:hover { background-color: #2b6cb0; }
        .btn-export { background-color: #38a169; }
        .btn-export:hover { background-color: #2f855a; }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-group label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
        .summary-box { background-color: #ebf8ff; border-left: 4px solid #3182ce; padding: 15px; margin-top: 15px; border-radius: 0 6px 6px 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
        th { background-color: #f7fafc; color: #4a5568; }
    </style>
</head>
<body>

<div class="container">
    <h1>สมุดบันทึกระบบ Si Inside Trade</h1>
    <p style="font-style: italic; color: #718096;">ทุกอย่างจะมาในเวลาที่พร้อมเสมอ</p>

    <!-- บันทึกรายการเทรดใหม่ -->
    <div class="section">
        <h2>บันทึกรายการเทรดใหม่</h2>
        
        <div class="form-group">
            <label>วันที่</label>
            <input type="text" placeholder="วว/ดด/ปปปป">
        </div>

        <!-- 1.1 แยกช่องเวลาตลาด และ 1.2 ช่องรอบที่ -->
        <div class="grid-2">
            <div class="form-group">
                <label>เวลาตลาด (Market Session)</label>
                <div class="flex-group">
                    <input type="time" id="marketTime" onchange="checkForexSession()">
                    <input type="text" id="marketSession" readonly placeholder="เซสชันตลาดอัตโนมัติ">
                </div>
            </div>
            <div class="form-group">
                <label>รอบที่</label>
                <select id="tradeRound">
                    <script>
                        for (let i = 1; i <= 99; i++) {
                            document.write('<option value="' + i + '">' + i + '</option>');
                        }
                    </script>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Lot</label>
            <input type="number" step="0.01" placeholder="0.01">
        </div>

        <div class="form-group">
            <label>เงื่อนไขเข้าเทรด (Setup)</label>
            <input type="text">
        </div>

        <div class="form-group">
            <label>ทิศทาง</label>
            <div class="radio-group">
                <label><input type="radio" name="direction" value="BUY" id="dirBuy" checked onclick="calculatePrices()"> BUY</label>
                <label><input type="radio" name="direction" value="SELL" id="dirSell" onclick="calculatePrices()"> SELL</label>
            </div>
        </div>

        <div class="form-group">
            <label>ราคาเข้า (Entry Price)</label>
            <input type="number" id="entryPrice" step="0.00001" value="0.00000" oninput="calculatePrices()">
        </div>

        <!-- 1.4 ปรับปรุงช่อง Stop Loss (SL) -->
        <div class="form-group">
            <label>Stop Loss (SL)</label>
            <div class="flex-group">
                <input type="number" id="slPoints" min="0" max="3000" placeholder="จุด (0-3000)" oninput="calculatePrices()">
                <input type="number" id="slPrice" readonly placeholder="ราคาสุทธิ SL">
            </div>
        </div>

        <!-- 1.4 ปรับปรุงช่อง Take Profit (TP) -->
        <div class="form-group">
            <label>Take Profit (TP)</label>
            <div class="flex-group">
                <input type="number" id="tpPoints" min="0" max="10000" placeholder="จุด (0-10000)" oninput="calculatePrices()">
                <input type="number" id="tpPrice" readonly placeholder="ราคาสุทธิ TP">
            </div>
        </div>

        <!-- 1.5 ปรับปรุงช่อง ราคาออก -->
        <div class="form-group">
            <label>ราคาออก (Exit Price)</label>
            <div class="flex-group">
                <input type="number" id="exitPoints" min="0" max="10000" placeholder="จุด (0-10000)" oninput="calculatePrices()">
                <input type="number" id="exitPrice" readonly placeholder="ราคาสุทธิ ออก">
            </div>
        </div>

        <div class="grid-2">
            <div class="form-group">
                <label>ต้นทุนสุทธิ</label>
                <input type="number" step="0.01">
            </div>
            <div class="form-group">
                <label>ผล (กำไร/ขาดทุน)</label>
                <input type="number" step="0.01">
            </div>
        </div>

        <div class="form-group">
            <button class="btn">บันทึกรายการ</button>
            <button class="btn" style="background-color: #e53e3e;">ยกเลิกการแก้ไข</button>
        </div>
    </div>

    <!-- ประวัติการเทรด -->
    <div class="section">
        <h2>ประวัติการเทรด</h2>
        <div>
            <button class="btn btn-export">⬇ ส่งออกข้อมูล (JSON)</button>
            <button class="btn btn-export">⬆ นำเข้าข้อมูล (JSON)</button>
            <button class="btn btn-export" id="exportImageBtn">📷 ส่งออกรูปสรุป (JPEG 10x10ซม.)</button>
            <button class="btn btn-export">📷 ส่งออกรูปทุกรายการ (JPEG)</button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>วันที่</th>
                    <th>เวลา/รอบ</th>
                    <th>Setup</th>
                    <th>ทิศทาง</th>
                    <th>ผลลัพธ์</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="5" style="text-align: center; color: #a0aec0;">ยังไม่มีข้อมูลประวัติการเทรด</td>
                </tr>
            </tbody>
        </table>

        <!-- 1.3 ย้ายสรุปภาพรวมมาไว้ใต้ปุ่มส่งออกภาพและใต้ประวัติการเทรด -->
        <div class="summary-box" id="summaryOverview">
            <h3>📊 สรุปภาพรวม</h3>
            <p>วินัยรวม: 100% | Win Rate: 0% | กำไรสุทธิ: $0.00</p>
        </div>
    </div>
</div>

<script>
function checkForexSession() {
    const timeInput = document.getElementById('marketTime').value;
    if (!timeInput) return;
    
    const [hours, minutes] = timeInput.split(':').map(Number);
    const timeVal = hours + (minutes / 60);
    
    // ตรวจสอบเดือนปัจจุบันเพื่อแยกฤดูร้อน/หนาวอัตโนมัติ
    const currentMonth = new Date().getMonth() + 1; 
    const isSummer = (currentMonth >= 3 && currentMonth <= 10);
    
    let sessions = [];
    
    if (isSummer) {
        if (timeVal >= 5 && timeVal < 14) sessions.push("ซิดนีย์");
        if (timeVal >= 7 && timeVal < 16) sessions.push("โตเกียว");
        if (timeVal >= 14 && timeVal < 23) sessions.push("ลอนดอน");
        if (timeVal >= 19 || timeVal < 4) sessions.push("นิวยอร์ก");
    } else {
        if (timeVal >= 4 && timeVal < 13) sessions.push("ซิดนีย์");
        if (timeVal >= 7 && timeVal < 16) sessions.push("โตเกียว");
        if (timeVal >= 15 || timeVal < 24) sessions.push("ลอนดอน"); // 15:00 - 00:00
        if (timeVal >= 20 || timeVal < 5) sessions.push("นิวยอร์ก");
    }
    
    document.getElementById('marketSession').value = sessions.length > 0 ? sessions.join(" / ") : "นอกเวลาตลาดหลัก";
}

function calculatePrices() {
    const entryPrice = parseFloat(document.getElementById('entryPrice').value) || 0;
    const isBuy = document.getElementById('dirBuy').checked;
    
    // ตั้งค่าตัวคูณจุดทศนิยมมาตรฐาน Forex/Gold (ตัวอย่างทั่วไป: 1 จุด = 0.01 สำหรับทองคำ หรือปรับเป็น 0.00001 ตามประเภทคู่เงิน)
    // เพื่อให้เข้ากันได้กับระบบเดิมของคุณ สามารถเปลี่ยนค่า multiplier ตรงนี้ได้เลยครับ
    const multiplier = 0.01; 

    // คำนวณ SL (0 - 3000 จุด)
    const slPoints = parseFloat(document.getElementById('slPoints').value) || 0;
    if (slPoints > 0 && entryPrice > 0) {
        const slPrice = isBuy ? (entryPrice - (slPoints * multiplier)) : (entryPrice + (slPoints * multiplier));
        document.getElementById('slPrice').value = slPrice.toFixed(5);
    } else {
        document.getElementById('slPrice').value = "";
    }

    // คำนวณ TP (0 - 10000 จุด)
    const tpPoints = parseFloat(document.getElementById('tpPoints').value) || 0;
    if (tpPoints > 0 && entryPrice > 0) {
        const tpPrice = isBuy ? (entryPrice + (tpPoints * multiplier)) : (entryPrice - (tpPoints * multiplier));
        document.getElementById('tpPrice').value = tpPrice.toFixed(5);
    } else {
        document.getElementById('tpPrice').value = "";
    }

    // คำนวณ ราคาออก (0 - 10000 จุด)
    const exitPoints = parseFloat(document.getElementById('exitPoints').value) || 0;
    if (exitPoints > 0 && entryPrice > 0) {
        const exitPrice = isBuy ? (entryPrice + (exitPoints * multiplier)) : (entryPrice - (exitPoints * multiplier));
        document.getElementById('exitPrice').value = exitPrice.toFixed(5);
    } else {
        document.getElementById('exitPrice').value = "";
    }
}
</script>

</body>
</html>
